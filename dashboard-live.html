  {label:'6 aug',spend:138.22,leads:5,cpl:27.64},{label:'7 aug',spend:94.93,leads:6,cpl:15.82},{label:'8 aug',spend:91.33,leads:1,cpl:91.33},{label:'9 aug',spend:85.98,leads:0,cpl:null},{label:'10 aug',spend:127.31,leads:6,cpl:21.22},{label:'11 aug',spend:102.66,leads:1,cpl:102.66},{label:'12 aug',spend:142.28,leads:2,cpl:71.14},{label:'13 aug',spend:94.21,leads:4,cpl:23.55},{label:'14 aug',spend:157.70,leads:3,cpl:52.57},{label:'15 aug',spend:110.69,leads:3,cpl:36.90},{label:'16 aug',spend:142.74,leads:5,cpl:28.55},{label:'17 aug',spend:174.35,leads:9,cpl:19.37},{label:'18 aug',spend:180.57,leads:5,cpl:36.11},{label:'19 aug',spend:123.88,leads:4,cpl:30.97},{label:'20 aug',spend:97.54,leads:4,cpl:24.39},{label:'21 aug',spend:116.10,leads:8,cpl:14.51},{label:'22 aug',spend:111.85,leads:3,cpl:37.28},{label:'23 aug',spend:142.06,leads:3,cpl:47.35},{label:'24 aug',spend:151.74,leads:5,cpl:30.35},{label:'25 aug',spend:158.00,leads:6,cpl:26.33},{label:'26 aug',spend:125.35,leads:4,cpl:31.34},{label:'27 aug',spend:141.33,leads:3,cpl:47.11},{label:'28 aug',spend:140.77,leads:4,cpl:35.19},{label:'29 aug',spend:136.08,leads:3,cpl:45.36},{label:'30 aug',spend:197.27,leads:1,cpl:197.27},{label:'31 aug',spend:173.92,leads:6,cpl:28.99}
];

function getDashboard(){
  try{
    const client=document.getElementById('client');
    const indexDoc=client?.contentDocument;
    const report=indexDoc?.getElementById('report');
    const reportDoc=report?.contentDocument;
    const dashboard=reportDoc?.getElementById('dashboard');
    return {doc:dashboard?.contentDocument,win:dashboard?.contentWindow};
  }catch(e){return {};}
}
function setText(doc,id,value){const el=doc?.getElementById(id);if(el)el.textContent=value;}
function eur(n){return Number(n).toLocaleString('nl-NL',{style:'currency',currency:'EUR'});}

function patchOrganicHistory(){
  const {doc,win}=getDashboard();
  if(!doc)return false;
  const selector=doc.getElementById('monthSelect');
  if(!selector)return false;
  if(!selector.dataset.ga4OrganicBound){
    selector.dataset.ga4OrganicBound='1';
    selector.addEventListener('change',()=>{
      [120,500,1100].forEach(ms=>setTimeout(patchOrganicHistory,ms));
      [140,550].forEach(ms=>setTimeout(patchDailyChart,ms));
      [160,600].forEach(ms=>setTimeout(patchOrganicWork,ms));
    });
  }
  const selectedIndex=ORGANIC_HISTORY.findIndex(row=>row.key===selector.value);
  if(selectedIndex<0)return true;
  const selected=ORGANIC_HISTORY[selectedIndex];
  const history=ORGANIC_HISTORY.slice(0,selectedIndex+1);
  setText(doc,'overviewOrganicLeads',String(selected.leads));
  setText(doc,'overviewOrganicLeadsNote','GA4 · Organic Search → /succes/');
  setText(doc,'organicLeads',String(selected.leads));
  setText(doc,'organicLeadsNote',`${selected.leads} unieke organische gebruikers op /succes/`);
  setText(doc,'organicLeadInsightTitle','Organische leads via GA4');
  setText(doc,'organicLeadInsightText',`${selected.label} 2026 · Organic Search → /succes/`);
  setText(doc,'organicLeadInsightValue',`${selected.leads} leads`);
  setText(doc,'funnelOrganicLeads',String(selected.leads));
  if(selector.value==='2026-08'){
    const status=doc.querySelector('.hero-status strong');
    if(status)status.innerHTML='Meta Ads: volledig augustus<br>Organisch (GSC): volledig augustus<br>Organische leads (GA4): volledig augustus';
    const msg=doc.querySelector('#monthMessage p');
    if(msg)msg.textContent='Augustus is volledig verwerkt voor de twee augustuscampagnes, Google Search Console en organische leads uit GA4. Organische leads zijn gemeten als unieke Organic Search-gebruikers op /succes/.';
  }
  if(win?.Chart){
    const canvas=doc.getElementById('organicTrendChart');
    const chart=canvas?win.Chart.getChart(canvas):null;
    if(chart?.data?.datasets?.length>=2){
      chart.config.type='line';
      chart.data.labels=history.map(row=>row.label);
      chart.data.datasets[0].label='Organische klikken (GSC)';
      chart.data.datasets[0].data=history.map(row=>row.clicks);
      chart.data.datasets[1].label='Organische leads (GA4)';
      chart.data.datasets[1].data=history.map(row=>row.leads);
      chart.options.interaction={mode:'index',intersect:false};
      chart.update('none');
      const panel=canvas.closest('.panel');
      const heading=panel?.querySelector('h3');
      const subtitle=panel?.querySelector('p');
      if(heading)heading.textContent='Ontwikkeling organische groei';
      if(subtitle)subtitle.textContent=`Januari t/m ${selected.label.toLowerCase()} 2026 · GSC-klikken + GA4-organische leads`;
    }
  }
  return true;
}

function patchOrganicWork(){
  const {doc}=getDashboard();
  if(!doc)return false;
  const selector=doc.getElementById('monthSelect');
  const organicCanvas=doc.getElementById('organicTrendChart');
  if(!selector||!organicCanvas)return false;
  if(!doc.getElementById('organicWorkStyle')){
    const style=doc.createElement('style');
    style.id='organicWorkStyle';
    style.textContent='.organic-work-wrap{margin-top:14px}.organic-work-summary{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:stretch}.organic-work-summary+.organic-work-summary{margin-top:14px}.organic-work-score{display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:132px;padding:18px;border:1px solid #dce9de;border-radius:14px;background:linear-gradient(135deg,#edf6ef,#fff)}.organic-work-score strong{font-size:31px;color:#1B294A}.organic-work-score span{margin-top:5px;font-size:9px;font-weight:700;color:#4f8258;text-align:center}.organic-work-copy{padding:17px;border:1px solid var(--border);border-radius:14px;background:#fff}.organic-work-copy h3{margin:0;color:#1B294A;font-size:13px}.organic-work-copy p{margin:6px 0 0;color:#6b7280;font-size:9px;line-height:1.6}.organic-blog-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}.organic-blog-item{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 12px;border:1px solid var(--border);border-radius:11px;background:#f8fafb}.organic-blog-id{display:grid;place-items:center;height:30px;border-radius:8px;background:#edf6ef;color:#4f8258;font-size:8px;font-weight:700}.organic-blog-item strong{display:block;color:#1B294A;font-size:9px;line-height:1.4}.organic-blog-item a{color:#4f8258;font-size:8px;font-weight:700;text-decoration:none;white-space:nowrap}@media(max-width:900px){.organic-work-summary,.organic-blog-grid{grid-template-columns:1fr}.organic-work-score{min-height:90px}.organic-blog-item{grid-template-columns:38px minmax(0,1fr)}}';
    doc.head.appendChild(style);
  }
  let section=doc.getElementById('organicWorkSection');
  if(!section){
    section=doc.createElement('div');
    section.id='organicWorkSection';
    section.className='organic-work-wrap';
    const blogRows=AUGUST_BLOGS.map(blog=>`<div class="organic-blog-item"><div class="organic-blog-id">${blog.id}</div><div><strong>${blog.title}</strong></div><a href="${blog.url}" target="_blank" rel="noopener">Bekijk blog →</a></div>`).join('');
    const rewriteRows=AUGUST_REWRITES.map(page=>`<div class="organic-blog-item"><div class="organic-blog-id">${page.id}</div><div><strong>${page.title}</strong></div><a href="${page.url}" target="_blank" rel="noopener">Bekijk pagina →</a></div>`).join('');
    section.innerHTML=`<div class="section-heading"><div><h2>Organische werkzaamheden</h2><p>Nieuwe én herschreven SEO-content uit augustus.</p></div><span class="source-label">SEO contentplanning · augustus 2026</span></div><div class="organic-work-summary"><div class="organic-work-score"><strong>12/12</strong><span>nieuwe blogs gepubliceerd</span></div><div class="organic-work-copy"><h3>Nieuwe blogs augustus</h3><p>De nieuwe artikelen zijn opgebouwd rond commerciële en informatieve zoekintenties binnen schuifpuien, kunststof deuren, onderhoud, tocht, isolatie en vervangen.</p><div class="organic-blog-grid">${blogRows}</div></div></div><div class="organic-work-summary"><div class="organic-work-score"><strong>7/7</strong><span>bestaande pagina's herschreven</span></div><div class="organic-work-copy"><h3>Herschreven pagina's en blogs augustus</h3><p>Bestaande pagina's zijn op basis van GSC-data, zoekintentie, interne links en kannibalisatie opnieuw uitgewerkt. Hieronder staan de zeven augustus-herschrijvingen.</p><div class="organic-blog-grid">${rewriteRows}</div></div></div>`;
    const organicGrid=organicCanvas.closest('.grid-2')||organicCanvas.closest('.panel');
    organicGrid?.insertAdjacentElement('afterend',section);
  }
  section.style.display=selector.value==='2026-08'?'block':'none';
  let nav=doc.getElementById('organicWorkNav');
  if(!nav){
    const organicNav=[...doc.querySelectorAll('.nav-link')].find(a=>a.getAttribute('href')==='#organisch');
    if(organicNav){
      nav=doc.createElement('a');
      nav.id='organicWorkNav';
      nav.className='nav-link';
      nav.href='#organicWorkSection';
      nav.textContent='Organische werkzaamheden';
      organicNav.insertAdjacentElement('afterend',nav);
    }
  }
  if(nav)nav.style.display=selector.value==='2026-08'?'flex':'none';
  return true;
}

function updateDailyReadout(doc,index){
  const row=DAILY_AUG[index],box=doc?.getElementById('dailyCplReadout');
  if(!row||!box)return;
  const cpl=row.cpl==null?'niet berekenbaar':eur(row.cpl);
  box.innerHTML=`<strong>${row.label}</strong><span><b>${row.leads} ${row.leads===1?'lead':'leads'}</b><i></i>CPL: <b>${cpl}</b><i></i>Spend: <b>${eur(row.spend)}</b></span>`;
}
function patchDailyChart(){
  const {doc,win}=getDashboard();
  if(!doc||!win?.Chart)return false;
  const selector=doc.getElementById('monthSelect');
  if(!selector||selector.value!=='2026-08')return true;
  const canvas=doc.getElementById('dailyCplChart'),chart=canvas?win.Chart.getChart(canvas):null,panel=doc.getElementById('dailyCplPanel');
  if(!canvas||!chart||!panel)return false;
  if(!doc.getElementById('dailyCplReadoutStyle')){
    const style=doc.createElement('style');
    style.id='dailyCplReadoutStyle';
    style.textContent='.daily-cpl-readout{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:12px 0 2px;padding:11px 13px;border:1px solid rgba(27,41,74,.1);border-radius:11px;background:#f8fafb;color:#1B294A}.daily-cpl-readout strong{font-size:11px;min-width:52px}.daily-cpl-readout span{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:9px;color:#596174}.daily-cpl-readout span b{color:#1B294A}.daily-cpl-readout i{width:4px;height:4px;border-radius:50%;background:#84BA8A}.daily-cpl-chart-wrap canvas{cursor:crosshair}';
    doc.head.appendChild(style);
  }
  let readout=doc.getElementById('dailyCplReadout');
  if(!readout){
    readout=doc.createElement('div');readout.id='dailyCplReadout';readout.className='daily-cpl-readout';
    panel.querySelector('.daily-cpl-chart-wrap')?.insertAdjacentElement('beforebegin',readout);
  }
  const subtitle=panel.querySelector('.panel-head p');
  if(subtitle)subtitle.textContent='Beweeg over een dag voor leads, CPL en spend · 6 t/m 31 augustus';
  chart.options.interaction={mode:'index',intersect:false};
  chart.options.plugins.tooltip={enabled:false};
  chart.data.datasets[0].pointRadius=4;chart.data.datasets[0].pointHoverRadius=7;chart.data.datasets[0].pointHitRadius=18;chart.data.datasets[0].spanGaps=false;chart.update('none');
  const note=panel.querySelector('.daily-cpl-note');
  if(note)note.textContent='Beweeg over een dag om leads, CPL en spend te bekijken. 9 augustus had €85,98 spend en 0 leads, waardoor geen CPL berekenbaar is. 30 augustus is de uitschieter: €197,27 CPL bij 1 lead.';
  updateDailyReadout(doc,DAILY_AUG.length-1);
  if(!canvas.dataset.dailyReadoutBound){
    canvas.dataset.dailyReadoutBound='1';
    const handle=event=>{const points=chart.getElementsAtEventForMode(event,'index',{intersect:false},true);if(points?.length)updateDailyReadout(doc,points[0].index);};
    canvas.addEventListener('pointermove',handle);canvas.addEventListener('click',handle);canvas.addEventListener('touchstart',handle,{passive:true});
  }
  return true;
}
function start(){
  let attempts=0;
  const timer=setInterval(()=>{attempts++;patchOrganicHistory();patchOrganicWork();patchDailyChart();if(attempts>=40)clearInterval(timer);},250);
}
document.getElementById('client').addEventListener('load',()=>{start();setTimeout(patchOrganicHistory,1500);setTimeout(patchOrganicWork,1600);setTimeout(patchDailyChart,1700);});
start();
</script>
</body>
</html>
